[workspace]
resolver = "2"
members = ["ui", "cli"]

[workspace.package]
version = "0.7.0"
authors = ["The Servo Project Developers"]
license = "MPL-2.0"
edition = "2024"
publish = false
rust-version = "1.88.0"
repository = "https://github.com/jomvick/servo"

[workspace.dependencies]
base64 = "0.23"
dirs = "7.0"
getrandom = "0.3"
gpui = { git = "https://github.com/jomvick/zed", rev = "e2ddcc6805f8c5088e62a60dfe517abcccd61a9a" }
gpui_platform = { git = "https://github.com/jomvick/zed", rev = "e2ddcc6805f8c5088e62a60dfe517abcccd61a9a", features = ["wayland", "x11", "font-kit", "runtime_shaders"] }
image = { version = "0.25", default-features = false, features = ["png"] }
serde_json = "1.0"
tungstenite = "0.30"
url = "2.5"
